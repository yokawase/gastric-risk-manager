name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "precision-health-googleaistudio"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gastric-risk-dashboard/package-lock.json
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Install dependencies
        run: npm install
        working-directory: gastric-risk-dashboard
      
      - name: Build
        run: npm run build
        working-directory: gastric-risk-dashboard
        env:
          NEXT_PUBLIC_API_URL: https://gastric-risk-api-xxxx.onrender.com
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gastric-risk-dashboard/out
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
